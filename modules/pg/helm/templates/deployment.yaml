apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bigbox-postgresql.fullname" . }}
  labels:
    {{- include "bigbox-postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bigbox-postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bigbox-postgresql.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: pg
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bigbox-postgresql.fullname" . }}-secret
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database }}
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.user }}
            initialDelaySeconds: 15
            periodSeconds: 5
          # Par TCP : pendant l'initialisation, l'image démarre un serveur temporaire joignable
          # uniquement par le socket Unix. Une sonde locale déclarerait le pod prêt (et rendrait
          # la main à helm --wait) avant que PostgreSQL n'accepte les connexions du NodePort.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - {{ .Values.postgresql.user }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: {{ include "bigbox-postgresql.fullname" . }}-pvc
