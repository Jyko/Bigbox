apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bigbox-hoppscotch.fullname" . }}-secret
  labels:
    {{- include "bigbox-hoppscotch.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  databaseUrl: "postgresql://{{ .Values.postgresql.username }}:{{ .Values.postgresql.password }}@{{ .Values.postgresql.hostname }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
  dataEncryptionKey: {{ required "La clé d'encryption de la database Hoppscotch est obligatoire : --set-file database.dataEncryptionKey=<fichier> 🚨" .Values.database.dataEncryptionKey | trim | quote }}
