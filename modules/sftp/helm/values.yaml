sftp:
  user: bigbox
  directory: upload

replicaCount: 1

image:
  repository: atmoz/sftp
  # atmoz/sftp ne publie pas de tags versionnés : épinglage par digest
  tag: "latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475"
  pullPolicy: IfNotPresent

initImage:
  repository: alpine
  tag: "3.24"

service:
  type: NodePort
  client: 30020

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

persistence:
  storageClass: "local-path"
  size: 250Mi
